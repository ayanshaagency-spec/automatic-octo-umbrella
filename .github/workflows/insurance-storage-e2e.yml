name: Insurance Private Storage + Malware E2E

on:
  push:
    branches: ["feat/phase8-health-insurance-documents"]
    paths:
      - "backend/src/insurance_*"
      - "backend/db/migrations/004_phase8_health_insurance_documents.sql"
      - "backend/package.json"
      - ".github/workflows/insurance-storage-e2e.yml"
  pull_request:
    branches: ["feat/phase6-emergency-hospitals"]
    paths:
      - "backend/src/insurance_*"
      - "backend/db/migrations/004_phase8_health_insurance_documents.sql"
      - "backend/package.json"
      - ".github/workflows/insurance-storage-e2e.yml"

jobs:
  private-storage-malware-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ayansha
          POSTGRES_PASSWORD: ayansha
          POSTGRES_DB: ayansha_healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ayansha -d ayansha_healthcare"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ayansha:ayansha@localhost:5432/ayansha_healthcare
      NODE_ENV: test
      PORT: "3926"
      JWT_SECRET: ci-only-insurance-private-storage-test-secret
      ADMIN_EMAIL: insurance-ci-admin@example.test
      ADMIN_PASSWORD: ci-only-insurance-admin-password
      INSURANCE_PIPELINE_E2E: "1"
      INSURANCE_S3_BUCKET: insurance-ci-documents
      INSURANCE_S3_REGION: us-east-1
      INSURANCE_S3_ACCESS_KEY_ID: insurance-ci-access
      INSURANCE_S3_SECRET_ACCESS_KEY: insurance-ci-secret-test-only
      INSURANCE_S3_ENDPOINT: http://127.0.0.1:9090
      INSURANCE_S3_FORCE_PATH_STYLE: "true"
      INSURANCE_CLAMAV_HOST: 127.0.0.1
      INSURANCE_CLAMAV_PORT: "3310"
      INSURANCE_CLAMAV_TIMEOUT_MS: "30000"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm run db:migrate
      - name: Start disposable S3 API simulator (test-only)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name insurance-s3mock \
            -p 127.0.0.1:9090:9090 \
            adobe/s3mock:latest
          for attempt in $(seq 1 90); do
            if curl --silent --output /dev/null http://127.0.0.1:9090; then exit 0; fi
            sleep 1
          done
          docker logs insurance-s3mock
          exit 1
      - name: Start private ClamAV malware scanner with CI-only signature
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Ayansha.Test.Quarantine:0:*:4159414E5348412D434C414D41562D544553542D494E464543544544' > "$RUNNER_TEMP/insurance-ci-test.ndb"
          docker run -d --name insurance-clamav \
            -p 127.0.0.1:3310:3310 \
            -v "$RUNNER_TEMP/insurance-ci-test.ndb:/tmp/insurance-ci-test.ndb:ro" \
            clamav/clamav:stable
      - name: Wait for ClamAV signature database and scanner
        shell: bash
        run: |
          node <<'NODE'
          const { Readable } = require('node:stream');
          const { scanStream } = require('./src/insurance_scanner');
          (async () => {
            let lastError;
            for (let attempt = 0; attempt < 180; attempt += 1) {
              try {
                const result = await scanStream(Readable.from([Buffer.from('Ayansha CI scanner readiness probe')]), { maxBytes: 1024 });
                if (result.status === 'clean') {
                  console.log('ClamAV accepted a clean readiness probe.');
                  return;
                }
                throw new Error('Unexpected scanner readiness result: ' + result.status);
              } catch (error) {
                lastError = error;
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }
            throw new Error('ClamAV did not become ready: ' + (lastError?.message || 'unknown error'));
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Reload ClamAV and verify CI-only synthetic signature
        shell: bash
        run: |
          set -euo pipefail
          docker exec insurance-clamav sh -c 'cp /tmp/insurance-ci-test.ndb /var/lib/clamav/ayansha-ci-test.ndb && chown clamav:clamav /var/lib/clamav/ayansha-ci-test.ndb'
          node <<'NODE'
          const net = require('node:net');
          function sendReload() {
            return new Promise((resolve, reject) => {
              const socket = net.createConnection({ host: '127.0.0.1', port: 3310 });
              let response = '';
              const timeout = setTimeout(() => {
                socket.destroy();
                reject(new Error('ClamAV reload command timed out after 120 seconds'));
              }, 120000);
              socket.on('connect', () => socket.write(Buffer.from('zRELOAD\0', 'ascii')));
              socket.on('data', chunk => {
                response += chunk.toString('utf8').replace(/\0/g, '').trim();
                if (response) {
                  clearTimeout(timeout);
                  socket.end();
                  resolve(response);
                }
              });
              socket.on('error', error => {
                clearTimeout(timeout);
                reject(error);
              });
            });
          }
          (async () => {
            const response = await sendReload();
            if (!/RELOAD/i.test(response)) throw new Error('Unexpected ClamAV reload response: ' + response.slice(0, 120));
            console.log('ClamAV reload accepted the updated signature database.');
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
          node <<'NODE'
          const { Readable } = require('node:stream');
          const { scanStream } = require('./src/insurance_scanner');
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let lastResult = null;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              lastResult = await scanStream(Readable.from([Buffer.from('AYANSHA-CLAMAV-TEST-INFECTED')]), { maxBytes: 1024 });
              if (lastResult.status === 'infected' && lastResult.signature === 'Ayansha.Test.Quarantine') {
                console.log('ClamAV loaded and detected the synthetic quarantine test marker.');
                return;
              }
              if (lastResult.status !== 'clean') {
                throw new Error('Unexpected ClamAV scan result: ' + lastResult.status + ' / ' + (lastResult.signature || 'no-signature'));
              }
              await pause(1000);
            }
            throw new Error('CI-only signature was not loaded after reload: ' +
              (lastResult?.status || 'no-result') + ' / ' + (lastResult?.signature || 'no-signature'));
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Verify private uploads, clean scan, synthetic quarantine and blocked downloads
        run: node --test src/insurance_pipeline_e2e.test.js
      - name: Show disposable service logs on failure
        if: failure()
        working-directory: .
        run: |
          docker logs insurance-s3mock || true
          docker logs insurance-clamav || true
      - name: Stop disposable services
        if: always()
        working-directory: .
        run: |
          docker rm -f insurance-s3mock insurance-clamav >/dev/null 2>&1 || true
