name: Flutter Mobile App

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "mobile-app/**"
      - ".github/workflows/dart.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/dart.yml"

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests when present
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No Flutter test directory yet; skipping test execution."
          fi
      - name: Build debug APK
        run: flutter build apk --debug
