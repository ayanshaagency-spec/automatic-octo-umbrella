name: Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/backend-postgres-safe-fixes
  pull_request:
    branches:
      - recovery/backend-postgres-safe-fixes

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ayansha
          POSTGRES_PASSWORD: ayansha
          POSTGRES_DB: ayansha_healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ayansha -d ayansha_healthcare"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ayansha:ayansha@localhost:5432/ayansha_healthcare
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: npm run db:migrate
      - name: Verify migration runner repeatability on disposable CI database
        run: npm run db:migrate
      - run: npm test
