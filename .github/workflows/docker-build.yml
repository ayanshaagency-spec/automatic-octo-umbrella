name: Docker Build Check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ayansha-health-care-backend:ci .
      - name: Smoke-test built container routes and admin page
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ayansha-health-care-ci \
            -p 127.0.0.1:3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=test \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            -e ADMIN_EMAIL=admin@example.test \
            -e ADMIN_PASSWORD=ci-only-admin-password \
            -e DATABASE_URL= \
            ayansha-health-care-backend:ci
          cleanup() { docker logs ayansha-health-care-ci || true; docker rm -f ayansha-health-care-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health -o /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent http://127.0.0.1:3000/ -o /tmp/home.html
          grep -q 'Ayansha Health Care' /tmp/home.html
          curl --fail --silent http://127.0.0.1:3000/web/app.js -o /tmp/app.js
          grep -q 'function' /tmp/app.js
          curl --fail --silent http://127.0.0.1:3000/web/insurance.js -o /tmp/insurance.js
          node --check /tmp/insurance.js
          grep -q 'My insurance documents' /tmp/home.html
          curl --fail --silent http://127.0.0.1:3000/admin -o /tmp/admin.html
          grep -q 'Ayansha Health Care Admin' /tmp/admin.html
          grep -q 'Health Insurance Document Reviews' /tmp/admin.html
          sed -n '/<script>/,/<\\/script>/p' /tmp/admin.html | sed '1d;$d' > /tmp/admin-inline.js
          node --check /tmp/admin-inline.js
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/db/health)" = "503"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/.env)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/src/server.js)" = "404"
          curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.test","password":"ci-only-admin-password"}' \
            http://127.0.0.1:3000/api/admin/login -o /tmp/admin-login.json
          grep -q '"role":"admin"' /tmp/admin-login.json
