name: Docker Build Check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ayansha-health-care-backend:ci .
      - name: Smoke-test built container routes and admin page
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ayansha-health-care-ci \
            -p 127.0.0.1:3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=test \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            -e ADMIN_EMAIL=admin@example.test \
            -e ADMIN_PASSWORD=ci-only-admin-password \
            -e DATABASE_URL= \
            ayansha-health-care-backend:ci
          cleanup() { docker logs ayansha-health-care-ci || true; docker rm -f ayansha-health-care-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          expect_contains() {
            local url="$1"
            local needle="$2"
            local body
            body="$(curl --fail --silent "$url")"
            if [[ "$body" != *"$needle"* ]]; then
              echo "::error::Smoke check failed for $url."
              return 1
            fi
          }
          expect_contains http://127.0.0.1:3000/health '"ok":true'
          expect_contains http://127.0.0.1:3000/ 'Ayansha Health Care'
          expect_contains http://127.0.0.1:3000/web/app.js 'function'
          expect_contains http://127.0.0.1:3000/admin 'Ayansha Health Care Admin'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/db/health)" = "503"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/.env)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/src/server.js)" = "404"
          admin_login_response="$(curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.test","password":"ci-only-admin-password"}' \
            http://127.0.0.1:3000/api/admin/login)"
          if [[ "$admin_login_response" != *'"role":"admin"'* ]]; then
            echo "::error::Admin login smoke test did not return the admin role."
            exit 1
          fi
