name: Client Demo Bundle Check

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/backend-postgres-safe-fixes
    paths:
      - "client-demo/**"
      - "web/**"
      - "doctor-panel/**"
      - "admin-panel/**"
      - ".github/workflows/client-demo-check.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing recovery branch
        uses: actions/checkout@v4

      - name: Verify all existing panel entry points and assets
        shell: bash
        run: |
          set -euo pipefail
          test -s client-demo/index.html
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s doctor-panel/index.html
          test -s doctor-panel/app.js
          test -s doctor-panel/health-record.js
          test -s doctor-panel/styles.css
          test -s admin-panel/index.html
          grep -q "Patient Experience" client-demo/index.html
          grep -q "Doctor Workspace" client-demo/index.html
          grep -q "Admin Operations" client-demo/index.html
          grep -q "static preview" client-demo/index.html

      - name: Package static client demo (no backend or secrets)
        run: |
          mkdir -p dist/ayansha-health-care-demo
          cp -R client-demo web doctor-panel admin-panel dist/ayansha-health-care-demo/
          # Keep the production app route unchanged; adjust only the packaged static demo copy.
          python3 - <<'PY'
          from pathlib import Path
          page = Path("dist/ayansha-health-care-demo/web/index.html")
          html = page.read_text(encoding="utf-8")
          old_link = 'href="/admin"'
          new_link = 'href="../admin-panel/"'
          if old_link not in html:
              raise SystemExit("Expected Admin Operations link was not found in packaged patient panel")
          page.write_text(html.replace(old_link, new_link), encoding="utf-8")
          if new_link not in page.read_text(encoding="utf-8"):
              raise SystemExit("Static Admin Operations link rewrite did not verify")
          PY
          cd dist
          zip -qr ayansha-health-care-demo.zip ayansha-health-care-demo

      - name: Upload reviewable demo bundle
        uses: actions/upload-artifact@v4
        with:
          name: ayansha-health-care-client-demo
          path: dist/ayansha-health-care-demo.zip
          if-no-files-found: error
          retention-days: 7
