name: Client Demo Bundle Check

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/backend-postgres-safe-fixes
    paths:
      - "client-demo/**"
      - "web/**"
      - "doctor-panel/**"
      - "admin-panel/**"
      - ".github/workflows/client-demo-check.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing recovery branch
        uses: actions/checkout@v4

      - name: Verify all existing panel entry points and assets
        shell: bash
        run: |
          set -euo pipefail
          test -s client-demo/index.html
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s doctor-panel/index.html
          test -s doctor-panel/app.js
          test -s doctor-panel/health-record.js
          test -s doctor-panel/styles.css
          test -s admin-panel/index.html
          test -s admin-panel/styles.css
          grep -q 'href="styles.css"' doctor-panel/index.html
          grep -q 'href="/admin-panel/styles.css"' admin-panel/index.html
          grep -q "Patient Experience" client-demo/index.html
          grep -q "Doctor Workspace" client-demo/index.html
          grep -q "Admin Operations" client-demo/index.html
          grep -q "static preview" client-demo/index.html

      - name: Validate patient web JavaScript and UI bindings
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check doctor-panel/app.js
          node --check doctor-panel/health-record.js
          test -s admin-panel/styles.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("admin-panel/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline admin script")
          Path("/tmp/admin-panel-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/admin-panel-inline.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.add(value)

          html = Path("web/index.html").read_text(encoding="utf-8")
          js = Path("web/app.js").read_text(encoding="utf-8")
          parser = IdParser()
          parser.feed(html)
          required = {
              "doctorSearch", "doctorList", "doctorId", "appointmentForm",
              "appointmentResult", "dashboardGrid", "loadDashboard",
              "aiBtn", "aiResult", "labForm", "labResult", "emergencyText",
              "loginModal", "loginForm", "verifyOtpForm", "loginPhone",
              "loginOtp", "requestOtpBtn", "verifyOtpBtn", "changePhoneBtn"
          }
          missing = sorted(required - parser.ids)
          if missing:
              raise SystemExit("Patient UI is missing required IDs: " + ", ".join(missing))
          referenced = set(re.findall(r"\$\('([^']+)'\)", js))
          unresolved = sorted(referenced - parser.ids)
          if unresolved:
              raise SystemExit("Patient JavaScript references missing UI IDs: " + ", ".join(unresolved))
          print(f"Verified {len(parser.ids)} patient UI IDs and {len(referenced)} JavaScript ID references.")
          PY

      - name: Package static client demo (no backend or secrets)
        run: |
          mkdir -p dist/ayansha-health-care-demo
          cp -R client-demo web doctor-panel admin-panel dist/ayansha-health-care-demo/
          # Rewrite only the packaged static copy so assets work under a repository subpath.
          python3 - <<'PY'
          from pathlib import Path
          patient = Path("dist/ayansha-health-care-demo/web/index.html")
          html = patient.read_text(encoding="utf-8")
          replacements = {
              'href="/web/styles.css"': 'href="styles.css"',
              'src="/web/app.js"': 'src="app.js"',
              'href="/admin"': 'href="../admin-panel/"',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Expected packaged patient asset/link missing: {old}")
              html = html.replace(old, new)
          patient.write_text(html, encoding="utf-8")
          admin = Path("dist/ayansha-health-care-demo/admin-panel/index.html")
          admin_html = admin.read_text(encoding="utf-8")
          if 'href="/admin-panel/styles.css"' not in admin_html:
              raise SystemExit("Expected admin stylesheet link missing")
          admin.write_text(admin_html.replace('href="/admin-panel/styles.css"', 'href="styles.css"'), encoding="utf-8")
          if 'href="../admin-panel/' not in patient.read_text(encoding="utf-8"):
              raise SystemExit("Static Admin Operations link rewrite did not verify")
          if 'href="styles.css"' not in admin.read_text(encoding="utf-8"):
              raise SystemExit("Static Admin stylesheet path rewrite did not verify")
          PY
          cd dist
          zip -qr ayansha-health-care-demo.zip ayansha-health-care-demo

      - name: Upload reviewable demo bundle
        uses: actions/upload-artifact@v4
        with:
          name: ayansha-health-care-client-demo
          path: dist/ayansha-health-care-demo.zip
          if-no-files-found: error
          retention-days: 7
