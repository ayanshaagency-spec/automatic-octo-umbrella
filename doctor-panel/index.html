<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AyanSha Health Care — Doctor Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div><strong>AyanSha Health Care</strong><span>Doctor Panel</span></div>
    <button id="refreshBtn" class="secondary">Refresh</button>
  </header>

  <main class="container">
    <section class="hero">
      <div><p class="eyebrow">Clinical workspace</p><h1>Doctor Dashboard</h1><p>Review appointments and create digital prescriptions securely through the shared API.</p></div>
      <div class="status" id="apiStatus">Checking API…</div>
    </section>

    <section class="grid">
      <div class="card wide">
        <div class="card-head"><h2>Appointment Queue</h2><span id="appointmentCount">0</span></div>
        <div id="appointments" class="list"><div class="empty">Loading appointments…</div></div>
      </div>

      <div class="card">
        <h2>Create Prescription</h2>
        <form id="prescriptionForm">
          <label>Appointment ID<input name="appointmentId" type="number" required placeholder="e.g. 12" /></label>
          <label>Diagnosis<input name="diagnosis" required placeholder="Diagnosis" /></label>
          <label>Notes<textarea name="notes" rows="3" placeholder="Clinical notes"></textarea></label>
          <div class="medicine-head"><strong>Medicines</strong><button type="button" id="addMedicine" class="secondary small">+ Add</button></div>
          <div id="medicines"></div>
          <button class="primary" type="submit">Save Prescription</button>
          <p id="formMessage" class="message"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
