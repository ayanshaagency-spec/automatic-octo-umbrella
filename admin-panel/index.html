<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3450"><title>Ayansha Health Care | Admin Operations</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin-panel/styles.css"></head>
<body><main>
  <h1>Ayansha Health Care <span style="font-size:13px;font-weight:700;color:#087e80;letter-spacing:0">/ Admin Operations</span></h1>
  <section id="login" class="card"><p class="eyebrow">SECURE ADMIN ACCESS</p><h2>Welcome back</h2><p>Sign in to manage appointment operations. Credentials are verified server-side; no admin secret is embedded in this page.</p><form id="adminLoginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" placeholder="name@company.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="loginBtn" type="submit">Sign in securely →</button><p id="loginError" class="error" role="status" aria-live="polite"></p></form></section>
  <section id="dashboard" class="hidden"><div class="card"><button id="logout" type="button">Log out</button><p class="eyebrow">OPERATIONS OVERVIEW</p><h2>Appointment operations</h2><p id="status">Loading authorised appointment data…</p><div id="appointments"></div></div></section>
</main>
<script>
const tokenKey='ayansha_admin_token',login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),email=document.getElementById('email'),password=document.getElementById('password');
const api=async(path,options={})=>{const headers={'Content-Type':'application/json',...(options.headers||{})},token=sessionStorage.getItem(tokenKey);if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...options,headers}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
async function load(){try{const rows=await api('/api/admin/appointments');document.getElementById('status').textContent=rows.length+' appointments';const list=document.getElementById('appointments');list.replaceChildren();if(!rows.length){const empty=document.createElement('p');empty.textContent='No appointments.';list.append(empty)}else{for(const a of rows){const row=document.createElement('div');row.className='row';const strong=document.createElement('strong');strong.textContent='#'+a.id+' — '+(a.doctor_name||'Doctor');row.append(strong,document.createElement('br'),document.createTextNode(String(a.patient_name||'')+' • '+String(a.phone||'')),document.createElement('br'),document.createTextNode([a.appointment_at,a.mode,a.status].map(v=>String(v??'')).join(' • ')));list.append(row)}}login.classList.add('hidden');dashboard.classList.remove('hidden')}catch(e){sessionStorage.removeItem(tokenKey);login.classList.remove('hidden');dashboard.classList.add('hidden');document.getElementById('loginError').textContent=e.message}}
document.getElementById('adminLoginForm').addEventListener('submit',async event=>{event.preventDefault();document.getElementById('loginError').textContent='';const button=document.getElementById('loginBtn');button.disabled=true;button.textContent='Signing in…';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});sessionStorage.setItem(tokenKey,d.token);await load()}catch(e){document.getElementById('loginError').textContent=e.message}finally{button.disabled=false;button.textContent='Sign in securely →'}});
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(tokenKey);login.classList.remove('hidden');dashboard.classList.add('hidden');password.value='';document.getElementById('loginError').textContent='You have signed out.'};if(sessionStorage.getItem(tokenKey))load();
</script></main></body></html>
