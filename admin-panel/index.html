<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayansha Health Care Admin</title><style>body{font-family:Arial,sans-serif;background:#f5f9fa;margin:0;color:#17343d}main{max-width:1100px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #dbe8eb;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #17343d10}input,button{padding:12px;border-radius:10px;border:1px solid #bfd1d6}input{display:block;width:100%;box-sizing:border-box;margin:8px 0 12px}button{background:#0e8f8f;color:white;border:0;cursor:pointer}.hidden{display:none}.error{color:#b42318}.row{padding:12px 0;border-bottom:1px solid #e5eeee}</style></head><body><main><h1>Ayansha Health Care — Admin</h1><section id="login" class="card"><h2>Admin Sign In</h2><p>Credentials are verified server-side. No admin secret is embedded in this page.</p><input id="email" type="email" autocomplete="username" placeholder="Admin email"><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button id="loginBtn">Sign in</button><p id="loginError" class="error"></p></section><section id="dashboard" class="hidden"><div class="card"><button id="logout">Log out</button><h2>Appointment Operations</h2><p id="status">Loading...</p><div id="appointments"></div></div></section><script>
const tokenKey='ayansha_admin_token',login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),email=document.getElementById('email'),password=document.getElementById('password');
const api=async(path,options={})=>{const headers={'Content-Type':'application/json',...(options.headers||{})},token=sessionStorage.getItem(tokenKey);if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{...options,headers}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
async function load(){try{const rows=await api('/api/admin/appointments');document.getElementById('status').textContent=rows.length+' appointments';document.getElementById('appointments').innerHTML=rows.map(a=>'<div class="row"><strong>#'+a.id+' — '+(a.doctor_name||'Doctor')+'</strong><br>'+a.patient_name+' • '+a.phone+'<br>'+a.appointment_at+' • '+a.mode+' • '+a.status+'</div>').join('')||'<p>No appointments.</p>';login.classList.add('hidden');dashboard.classList.remove('hidden')}catch(e){sessionStorage.removeItem(tokenKey);login.classList.remove('hidden');dashboard.classList.add('hidden');document.getElementById('loginError').textContent=e.message}}
document.getElementById('loginBtn').onclick=async()=>{document.getElementById('loginError').textContent='';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});sessionStorage.setItem(tokenKey,d.token);await load()}catch(e){document.getElementById('loginError').textContent=e.message}};
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(tokenKey);load()};if(sessionStorage.getItem(tokenKey))load();
</script></main></body></html>
